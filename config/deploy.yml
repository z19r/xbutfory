# Kamal deploy for XbutforY: one host running web (Thruster-wrapped Puma),
# a Sidekiq job role, and Postgres + Redis accessories on the same box.
#
# The three <REPLACE:*> values below are the only things standing between
# this file and a real deploy. Secrets live in .kamal/secrets (pulled from
# ENV / a password manager), never here.
service: xbutfory

image: <REPLACE:registry-user>/xbutfory

servers:
  web:
    - <REPLACE:server-ip>
  job:
    hosts:
      - <REPLACE:server-ip>
    cmd: bundle exec sidekiq

# Cloudflare fronts the app: set SSL/TLS mode to "Full" so CF-to-app is
# encrypted too. kamal-proxy handles the Let's Encrypt cert; production.rb
# already sets assume_ssl + force_ssl.
proxy:
  ssl: true
  host: xbutfory.com

registry:
  server: ghcr.io
  username: <REPLACE:registry-user>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    # Optional overrides; the app prefers Rails credentials for these, so
    # only wire them if credentials aren't used:
    # - SENTRY_DSN
    # - STRIPE_SECRET_KEY
    # - STRIPE_WEBHOOK_SECRET
    # - MAILGUN_SMTP_LOGIN
    # - MAILGUN_SMTP_PASSWORD
  clear:
    APP_HOST: xbutfory.com
    # Sidekiq + Rack::Attack + Rails cache all ride this Redis accessory.
    REDIS_URL: redis://xbutfory-redis:6379/0
    DB_HOST: xbutfory-db
    POSTGRES_USER: xbutfory
    POSTGRES_DB: xbutfory_production
    WEB_CONCURRENCY: 2

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - 'xbutfory_storage:/rails/storage'

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16
    host: <REPLACE:server-ip>
    # Bound to localhost — only the kamal docker network reaches it.
    port: '127.0.0.1:5432:5432'
    env:
      clear:
        POSTGRES_USER: xbutfory
        POSTGRES_DB: xbutfory_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  redis:
    image: valkey/valkey:8
    host: <REPLACE:server-ip>
    port: '127.0.0.1:6379:6379'
    directories:
      - data:/data

# Render Blueprint for XbutforY, grouped under the Z19R project (production
# environment). Everything is pinned to virginia.
#
# Redis layout follows the Z19R convention (see markbin-dot-net):
#   REDIS_SIDEKIQ_URL -> this project's own Key Value instance, queue only
#     (noeviction: Sidekiq jobs must never be evicted under memory pressure).
#   REDIS_URL         -> the shared cross-project cache Redis; this project
#     owns DB 4 on it (redis://<shared-host>:6379/4, entered on the env
#     group). Rack::Attack throttle counters live here.
#
# Apply: Render dashboard -> New -> Blueprint -> point at this repo.
# Secrets are entered once on the xbutfory-common env group (sync: false
# prompts); both services pull it via fromGroup.
#
# Solid Cache / Solid Cable ride the same Postgres database as the app on
# Render (their tables are namespaced; database.yml maps all three configs
# to DATABASE_URL when it's present). bin/rails db:prepare migrates all of
# them before each deploy goes live.

projects:
  - name: xbutfory
    environments:
      - name: production
        databases:
          - name: xbutfory-db
            plan: basic-256mb
            region: virginia
            postgresMajorVersion: '18'
            ipAllowList: []

        services:
          - type: keyvalue
            name: xbutfory-redis-sidekiq
            # Paid plan on purpose: the free tier is non-persistent, and
            # losing the Sidekiq queue on restart means losing enqueued mail.
            plan: starter
            region: virginia
            maxmemoryPolicy: noeviction
            ipAllowList: [] # private-network access only

          - type: web
            name: xbutfory-web
            runtime: docker
            plan: starter
            region: virginia
            healthCheckPath: /up
            # Migrates primary + cache + cable before going live.
            preDeployCommand: ./bin/rails db:prepare
            envVars:
              - fromGroup: xbutfory-common
              - key: DATABASE_URL
                fromDatabase:
                  name: xbutfory-db
                  property: connectionString
              - key: REDIS_SIDEKIQ_URL
                fromService:
                  type: keyvalue
                  name: xbutfory-redis-sidekiq
                  property: connectionString
              - key: WEB_CONCURRENCY
                value: 2
              # Thruster fronts Puma (Dockerfile CMD is bin/thrust).
              # Thruster listens on HTTP_PORT for Render's traffic and
              # sets the child PORT to TARGET_PORT, so Puma binds 3000.
              - key: PORT
                value: '10000'
              - key: HTTP_PORT
                value: '10000'
              - key: TARGET_PORT
                value: '3000'

          - type: worker
            name: xbutfory-worker
            runtime: docker
            plan: starter
            region: virginia
            dockerCommand: bundle exec sidekiq
            envVars:
              - fromGroup: xbutfory-common
              - key: DATABASE_URL
                fromDatabase:
                  name: xbutfory-db
                  property: connectionString
              - key: REDIS_SIDEKIQ_URL
                fromService:
                  type: keyvalue
                  name: xbutfory-redis-sidekiq
                  property: connectionString

        # The Z19R-standard common group (mirrors markbin-dot-net's; no
        # PostHog ever, ActiveRecord encryption keys only if/when the app
        # encrypts columns). Secrets are sync: false so Render prompts
        # once and both services see the same value.
        envVarGroups:
          - name: xbutfory-common
            envVars:
              - key: RAILS_MASTER_KEY
                sync: false
              # Shared Z19R cache Redis, DB 4 for this project:
              # redis://<shared-host>:6379/4
              - key: REDIS_URL
                sync: false
              # jemalloc for reduced memory/latency (also set in the
              # Dockerfile; kept here for parity across Z19R projects).
              - key: LD_PRELOAD
                value: '/usr/lib/x86_64-linux-gnu/libjemalloc.so.2'
              # Host for links generated in mailer templates.
              - key: MAILER_HOST
                value: xbutfory.com
              # Mailgun API delivery: sending key + verified domain.
              - key: MAILGUN_API_KEY
                sync: false
              - key: MAILGUN_HOST
                value: xbutfory.com
              - key: MAILGUN_UN
                value: emailsenderuserguy@xbutfory.com
              # Sentry error tracking (initializer is dormant without a DSN).
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENABLE_LOGS
                value: 'true'
              # Stripe (Featured listing tier — wired up as the next feature).
              - key: STRIPE_PUBLISHABLE_KEY
                sync: false
              - key: STRIPE_SECRET_KEY
                sync: false
              - key: STRIPE_WEBHOOK_SECRET
                sync: false
              # Umami analytics (layout renders the script when set).
              - key: UMAMI_WEBSITE_ID
                value: d4db2804-b24b-4d2b-8d89-229ede6cacf1
              # Mail/OG links point at the live custom domain (legacy
              # fallback; MAILER_HOST is the standard var).
              - key: APP_HOST
                value: xbutfory.com
